<!DOCTYPE html>
<html>
<head>
  <title>Trang web cute với 8 ảnh và trái tim rơi to</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Comic+Neue:wght@700&display=swap');

    body {
      background-color: #fff0f5;
      font-family: 'Comic Neue', cursive;
      text-align: center;
      overflow: hidden;
      padding: 20px;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #ff3399;
      font-size: 42px;
      margin-top: 20px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }

    .gallery img {
      width: 200px;
      border-radius: 15px;
      box-shadow: 0 0 10px pink;
    }

    .heart {
      position: absolute;
      top: -50px;
      font-size: 50px; /* trái tim to hơn */
      color: red;
      animation: fall 6s linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    button {
      background-color: #ff99cc;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Comic Neue', cursive;
      margin-top: 20px;
    }

    button:hover {
      background-color: #ff66b2;
    }
  </style>
</head>
<body>
  <h1>Voo iuuuu bámmm vàooo ùiiii họoo 💕</h1>

  <!-- Bộ sưu tập 8 ảnh -->
  <div class="gallery">
    <img src="images/Screenshot 2026-01-26 191121.png">
    <img src="images/Screenshot 2026-01-26 191207.png">
    <img src="images/Screenshot 2026-01-26 191238.png">
    <img src="images/Screenshot 2026-02-05 111708.png">
    <img src="images/Screenshot 2026-02-05 111732.png">
    <img src="images/Screenshot 2026-02-05 111747.png">
    <img src="images/Screenshot 2026-02-05 111755.png">
    <img src="images/Screenshot 2026-03-15 150630.png">
  </div>

  <!-- Một nút bấm -->
  <button onclick="window.location.href='https://secret-heart-box--tenh3604.replit.app'">hoiiii hongg treuuu voo nuaaa iii típpp huiii</button>

  <!-- Script tạo hiệu ứng trái tim rơi -->
  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerText = "❤️";
      heart.style.left = Math.random() * window.innerWidth + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    // Tạo nhiều trái tim hơn: mỗi 200ms thay vì 500ms
    setInterval(createHeart, 200);
  </script>
</body>
</html>
